<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="color-scheme" content="dark light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radio CB">
    <title>Radio CB</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>
        // Apply the theme before first paint (no flash of the wrong theme).
        // Saved choice wins, otherwise follow the system preference.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var theme = saved || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f0f2f5' : '#1a1a2e');
        })();
    </script>
    <style>
        /* ── THEME ─────────────────────────────────────────────── */
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #fff;
            --text-secondary: #aaa;
            --text-muted: #777;
            --accent: #ff6b6b;
            --border-color: #333;
            --placeholder-color: #555;
            --loading-bg: #555;
            --slider-track: rgba(255, 255, 255, 0.14);
            --cover-shadow: rgba(255, 107, 107, 0.18);
            --btn-text: #fff;
            --ghost-bg: rgba(255, 255, 255, 0.08);
            --ghost-hover: rgba(255, 255, 255, 0.16);
            --focus-ring: rgba(255, 107, 107, 0.6);

            /* layout tokens */
            --pad-x: max(20px, env(safe-area-inset-left), env(safe-area-inset-right));
            --gap: clamp(12px, 2.6dvh, 28px);
            --cover: min(82vw, 42dvh, 400px);
            --play: clamp(60px, 9dvh, 76px);
            --topbar-h: 64px;
        }

        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #fff;
            --text-primary: #1a1a2e;
            --text-secondary: #555;
            --text-muted: #888;
            --accent: #e84545;
            --border-color: #ddd;
            --placeholder-color: #aaa;
            --loading-bg: #ccc;
            --slider-track: rgba(0, 0, 0, 0.12);
            --cover-shadow: rgba(0, 0, 0, 0.16);
            --btn-text: #fff;
            --ghost-bg: rgba(0, 0, 0, 0.06);
            --ghost-hover: rgba(0, 0, 0, 0.12);
            --focus-ring: rgba(232, 69, 69, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            transition: background 0.3s ease, color 0.3s ease;
        }

        button { font: inherit; color: inherit; }

        :focus { outline: none; }
        :focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 3px;
        }

        /* ── TOP BAR ───────────────────────────────────────────── */
        .topbar {
            flex: none;
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            align-items: center;
            height: calc(var(--topbar-h) + env(safe-area-inset-top));
            padding: env(safe-area-inset-top) var(--pad-x) 0;
            position: relative;
            z-index: 100;
        }

        .app-title {
            text-align: center;
            font-size: 20px;
            font-weight: 300;
            text-transform: uppercase;
            color: var(--accent);
            visibility: hidden;
        }
        body.authed .app-title { visibility: visible; }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--ghost-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--text-primary);
            transition: fill 0.3s ease;
        }

        .theme-toggle .icon-sun { display: none; }
        [data-theme="light"] .theme-toggle .icon-sun { display: block; }
        [data-theme="light"] .theme-toggle .icon-moon { display: none; }

        /* ── DROPDOWN MENU ─────────────────────────────────────── */
        .dropdown-menu {
            position: absolute;
            top: calc(env(safe-area-inset-top) + var(--topbar-h) - 6px);
            left: var(--pad-x);
            min-width: 170px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 0;
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .dropdown-menu.open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            visibility: visible;
        }
        .dropdown-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 44px;
            padding: 0 16px;
            border: none;
            background: none;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .dropdown-menu button svg {
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
            flex-shrink: 0;
        }

        /* ── MAIN AREA ─────────────────────────────────────────── */
        .stage {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            display: flex;
            padding: 14px var(--pad-x) max(16px, env(safe-area-inset-bottom));
        }
        /* margin:auto centres the content but never clips it when space runs out */
        .stage > * { margin: auto; }

        /* ── LOGIN ─────────────────────────────────────────────── */
        .login-screen {
            text-align: center;
            max-width: 360px;
            width: 100%;
            padding-bottom: var(--topbar-h); /* optical centring */
        }
        body.authed .login-screen { display: none; }

        .login-screen .logo {
            font-size: 24px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
            font-weight: 300;
        }
        .login-screen h2 {
            font-size: 22px;
            font-weight: 300;
            margin-bottom: 40px;
            color: var(--text-secondary);
        }
        .login-field { margin-bottom: 16px; }
        .login-field input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 16px; /* ≥16px avoids iOS zoom on focus */
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            transition: border-color 0.2s, background 0.3s ease, color 0.3s ease;
        }
        .login-field input:focus { border-color: var(--accent); }
        .login-field input::placeholder { color: var(--placeholder-color); }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.2s;
        }
        .login-btn:active { transform: scale(0.97); }
        .login-error {
            color: var(--accent);
            font-size: 13px;
            margin-top: 14px;
            min-height: 20px;
        }

        /* ── PLAYER ────────────────────────────────────────────── */
        .player {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        body.authed .player { display: flex; }

        .cover-container {
            flex: none;
            width: var(--cover);
            height: var(--cover);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 28px var(--cover-shadow);
            background: var(--bg-secondary);
            transition: background 0.3s ease, box-shadow 0.3s ease, border-radius 0.3s ease;
        }
        /* The fallback logo already has its own rounded corners: match them */
        .cover-container.fallback {
            border-radius: 18.75%;
            background: #0e0f14;
        }
        .cover-container img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.35s ease;
        }
        .cover-container img.fading { opacity: 0; }

        .meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
            width: 100%;
            min-width: 0;
        }

        .track { width: 100%; min-width: 0; }

        .song-title {
            font-size: clamp(18px, 2.6dvh, 22px);
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
        }
        .artist {
            font-size: clamp(14px, 2.1dvh, 17px);
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 1.3em;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .play-btn {
            width: var(--play);
            height: var(--play);
            border-radius: 50%;
            border: none;
            background: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.2s ease, filter 0.2s;
        }
        .play-btn:active { transform: scale(0.92); }
        .play-btn svg {
            width: 42%;
            height: 42%;
            fill: var(--btn-text);
        }
        .play-btn .icon-play { margin-left: 8%; } /* optical centring of the triangle */
        .play-btn.loading {
            background: var(--loading-bg);
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            min-height: 1.3em;
        }

        /* Volume */
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 260px;
        }
        .volume-container.unsupported { display: none; }
        .volume-container svg {
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
            flex-shrink: 0;
        }
        .volume-slider {
            --val: 80%;
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            min-width: 0;
            height: 24px; /* generous hit area, thin visual track */
            background: transparent;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, var(--accent) var(--val), var(--slider-track) var(--val));
        }
        .volume-slider::-moz-range-track {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, var(--accent) var(--val), var(--slider-track) var(--val));
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            margin-top: -6px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            transition: transform 0.15s ease;
        }
        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
        }
        .volume-slider:active::-webkit-slider-thumb { transform: scale(1.2); }
        .volume-slider:focus-visible { outline-offset: 0; border-radius: 12px; }

        /* ── LANDSCAPE / DESKTOP: cover beside the controls ────── */
        /* Any wide-ish window (even a small desktop/PWA window) goes side by side;
           the cover is sized on the real free height so nothing falls off-screen. */
        @media (min-width: 460px) and (min-aspect-ratio: 5/4), (max-height: 520px) and (min-aspect-ratio: 1/1) {
            :root {
                --cover: min(40vw, calc(100dvh - var(--topbar-h) - env(safe-area-inset-top) - 64px), 440px);
                --play: clamp(56px, 9dvh, 72px);
            }
            .player {
                flex-direction: row;
                justify-content: center;
                gap: clamp(28px, 5vw, 64px);
                max-width: 960px;
                text-align: left;
            }
            .meta {
                align-items: flex-start;
                flex: 1;
                max-width: 400px;
            }
            .controls { flex-direction: row; gap: 16px; }
            .volume-container { justify-content: flex-start; }
        }

        /* Larger screens: a bit more presence for the text */
        @media (min-width: 1024px) and (min-height: 700px) {
            :root { --cover: min(40vw, calc(100dvh - var(--topbar-h) - 160px), 540px); }
            .player { max-width: 1100px; }
            .song-title { font-size: 28px; }
            .artist { font-size: 19px; }
            .app-title { font-size: 22px; }
        }

        /* Phones in landscape: very little height, compact chrome */
        @media (orientation: landscape) and (max-height: 500px) {
            :root {
                --topbar-h: 52px;
                --gap: 10px;
                --cover: min(40vw, calc(100dvh - var(--topbar-h) - env(safe-area-inset-top) - 40px));
            }
            .icon-btn { width: 40px; height: 40px; }
            .topbar { grid-template-columns: 40px 1fr 40px; }
            .app-title { font-size: 17px; }
            .login-screen { padding-bottom: 0; }
            .login-screen h2 { margin-bottom: 20px; }
        }

        /* ── HOVER (only on devices that really hover) ─────────── */
        @media (hover: hover) and (pointer: fine) {
            .icon-btn:hover,
            .dropdown-menu button:hover,
            .info-close-btn:hover { background: var(--ghost-hover); }
            .play-btn:hover, .login-btn:hover { filter: brightness(1.08); }
            .volume-slider:hover::-webkit-slider-thumb { transform: scale(1.2); }
        }

        /* ── INFO OVERLAY ──────────────────────────────────────── */
        .info-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s;
        }
        .info-overlay.visible { opacity: 1; visibility: visible; }
        .info-overlay-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }
        .info-panel {
            position: relative;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 28px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            transform: scale(0.92);
            transition: transform 0.25s ease, background 0.3s ease;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
        }
        .info-overlay.visible .info-panel { transform: scale(1); }
        .info-panel-title {
            font-size: 20px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 300;
            margin-bottom: 12px;
        }
        .info-panel-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .info-panel-meta {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.8;
        }
        .info-close-btn {
            margin-top: 20px;
            min-height: 40px;
            padding: 0 24px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: none;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="topbar">
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="dropdownMenu">
            <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
        </button>

        <div class="app-title">Radio CB</div>

        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Cambia tema">
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <div class="dropdown-menu" id="dropdownMenu" role="menu">
            <button id="menuInfo" role="menuitem">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Info
            </button>
        </div>
    </header>

    <main class="stage">
        <!-- LOGIN SCREEN -->
        <div class="login-screen" id="loginScreen">
            <div class="logo">Radio CB</div>
            <h2>Accesso riservato</h2>
            <div class="login-field">
                <input type="password" id="passwordInput" placeholder="Password" autocomplete="off" aria-label="Password" enterkeyhint="go">
            </div>
            <button class="login-btn" id="loginBtn">Entra</button>
            <div class="login-error" id="loginError" role="alert"></div>
        </div>

        <!-- PLAYER SCREEN -->
        <div class="player" id="playerScreen">
            <div class="cover-container fallback" id="coverContainer">
                <img id="coverImage" alt="Copertina" draggable="false">
            </div>

            <div class="meta">
                <div class="track">
                    <div class="song-title" id="songTitle">Radio CB</div>
                    <div class="artist" id="artistName">In caricamento...</div>
                </div>

                <div class="controls">
                    <button class="play-btn" id="playBtn" aria-label="Riproduci">
                        <svg id="iconPlay" class="icon-play" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
                        <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
                    </button>
                    <div class="status" id="statusText" aria-live="polite">Pronto</div>
                </div>

                <div class="volume-container" id="volumeContainer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.5 4.5 0 0 0 2.5-3.5z"/></svg>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.47 4.47 0 0 0 2.5-3.5zM14 3.23v2.06a8 8 0 0 1 0 13.42v2.06A10 10 0 0 0 14 3.23z"/></svg>
                </div>
            </div>
        </div>
    </main>

    <!-- INFO OVERLAY -->
    <div class="info-overlay" id="infoOverlay" role="dialog" aria-modal="true" aria-label="Informazioni">
        <div class="info-overlay-backdrop" id="infoBackdrop"></div>
        <div class="info-panel">
            <div class="info-panel-title">Radio CB</div>
            <div class="info-panel-desc">Una radio 24h, non stop</div>
            <div class="info-panel-meta">
                Versione 1.2<br>
                Author: marcomauro e Claude Opus 4.6
            </div>
            <button class="info-close-btn" id="infoCloseBtn">Chiudi</button>
        </div>
    </div>

    <script>
        // --- HAMBURGER MENU ---
        const menuToggle = document.getElementById('menuToggle');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const menuInfo = document.getElementById('menuInfo');
        const infoOverlay = document.getElementById('infoOverlay');
        const infoBackdrop = document.getElementById('infoBackdrop');
        const infoCloseBtn = document.getElementById('infoCloseBtn');

        function setMenu(open) {
            dropdownMenu.classList.toggle('open', open);
            menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        function openInfo() {
            setMenu(false);
            infoOverlay.classList.add('visible');
            infoCloseBtn.focus({ preventScroll: true });
        }

        function closeInfo() {
            infoOverlay.classList.remove('visible');
        }

        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            setMenu(!dropdownMenu.classList.contains('open'));
        });

        document.addEventListener('click', function(e) {
            if (!dropdownMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                setMenu(false);
            }
        });

        menuInfo.addEventListener('click', openInfo);
        infoCloseBtn.addEventListener('click', closeInfo);
        infoBackdrop.addEventListener('click', closeInfo);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                setMenu(false);
                closeInfo();
            }
        });

        // --- THEME ---
        document.getElementById('themeToggle').addEventListener('click', function() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            document.querySelector('meta[name="theme-color"]').setAttribute('content',
                next === 'light' ? '#f0f2f5' : '#1a1a2e'
            );
        });

        // --- OBFUSCATED CONFIG ---
        const _k = 'RadioCB2024';
        const _d = {
            s: 'OhUQGRx5bR1eQAVgTwoMGDEjVlldGjsVXlFZcXQdQ0ZGNwAJ',
            m: 'OhUQGRx5bR1eQAVgTwoMGDEjVlldGjsVXlFZcXQdQ0ZVJhQXRAUwLVweSkc+'
        };
        // SHA-256 hash of the password
        const _h = 'ea9d9e6c5f0ea4f21d4dfa3d8b51c2f264dcffa2e7fc5b68840a7b58ae7fc81d';

        function _x(encoded) {
            const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
            return Array.from(bytes, (b, i) => String.fromCharCode(b ^ _k.charCodeAt(i % _k.length))).join('');
        }

        async function _sha256(text) {
            const data = new TextEncoder().encode(text);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- LOGIN ---
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        // Check if already authenticated this session
        if (sessionStorage.getItem('_auth') === '1') {
            showPlayer();
        } else if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            // Desktop: focus the field right away (on mobile it would pop up the keyboard)
            passwordInput.focus();
        }

        async function attemptLogin() {
            const pwd = passwordInput.value;
            if (!pwd) {
                loginError.textContent = 'Inserisci la password';
                return;
            }
            const hash = await _sha256(pwd);
            if (hash === _h) {
                sessionStorage.setItem('_auth', '1');
                passwordInput.blur();
                showPlayer();
            } else {
                loginError.textContent = 'Password non valida';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        loginBtn.addEventListener('click', attemptLogin);
        passwordInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') attemptLogin();
        });

        function showPlayer() {
            document.body.classList.add('authed');
            initPlayer();
        }

        // --- PLAYER ---
        function initPlayer() {
            const STREAM_URL   = _x(_d.s);
            const METADATA_URL = _x(_d.m);
            const FALLBACK_COVER = './icons/icon-512.png';

            const playBtn         = document.getElementById('playBtn');
            const iconPlay        = document.getElementById('iconPlay');
            const iconPause       = document.getElementById('iconPause');
            const statusText      = document.getElementById('statusText');
            const songTitle       = document.getElementById('songTitle');
            const artistName      = document.getElementById('artistName');
            const coverImage      = document.getElementById('coverImage');
            const coverContainer  = document.getElementById('coverContainer');
            const volumeSlider    = document.getElementById('volumeSlider');
            const volumeContainer = document.getElementById('volumeContainer');

            coverImage.src = FALLBACK_COVER;

            let audio    = null;
            let audioGen = 0;   // generation counter — invalidates stale audio events
            let lastTitle = '';
            let currentMeta = { title: 'Radio CB', artist: '' };

            // ── COVER ────────────────────────────────────────────────────
            // Preload the new image, then cross-fade it in (no flicker or
            // half-loaded images). Falls back to the logo on any error.
            let coverReq = 0;
            function setCover(url) {
                const req = ++coverReq;
                const isFallback = url === FALLBACK_COVER;
                const pre = new Image();
                pre.onload = () => {
                    if (req !== coverReq) return;
                    coverImage.classList.add('fading');
                    setTimeout(() => {
                        if (req !== coverReq) return;
                        coverImage.src = url;
                        coverContainer.classList.toggle('fallback', isFallback);
                        coverImage.classList.remove('fading');
                        updateMediaSession();
                    }, 200);
                };
                pre.onerror = () => {
                    if (req === coverReq && !isFallback) setCover(FALLBACK_COVER);
                };
                pre.src = url;
            }

            function updateMediaSession() {
                if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
                const isFallback = coverContainer.classList.contains('fallback');
                navigator.mediaSession.metadata = new MediaMetadata({
                    title:   currentMeta.title,
                    artist:  currentMeta.artist,
                    album:   'Radio CB',
                    artwork: [{
                        src: coverImage.src,
                        sizes: isFallback ? '512x512' : '600x600',
                        type: isFallback ? 'image/png' : 'image/jpeg'
                    }]
                });
            }

            // ── VOLUME ───────────────────────────────────────────────────
            // iOS ignores audio.volume (hardware buttons only): hide the slider there.
            (function detectVolumeSupport() {
                const probe = new Audio();
                probe.volume = 0.5;
                if (probe.volume !== 0.5) volumeContainer.classList.add('unsupported');
            })();

            function paintVolume() {
                volumeSlider.style.setProperty('--val', volumeSlider.value + '%');
            }
            paintVolume();

            // ── STATE MACHINE ────────────────────────────────────────────
            // IDLE → CONNECTING → PLAYING
            //              ↓           ↓
            //         BUFFERING    RECOVERING → CIRCUIT_OPEN
            //              ↓           ↓
            //           PAUSED      OFFLINE
            const S = {
                IDLE:         'idle',
                CONNECTING:   'connecting',
                PLAYING:      'playing',
                BUFFERING:    'buffering',
                PAUSED:       'paused',
                RECOVERING:   'recovering',
                CIRCUIT_OPEN: 'circuit_open',
                OFFLINE:      'offline'
            };

            let state = S.IDLE;

            function setState(next) {
                state = next;
                const showPause   = next === S.PLAYING   || next === S.BUFFERING;
                const showLoading = next === S.CONNECTING || next === S.BUFFERING || next === S.RECOVERING;
                iconPlay.style.display  = showPause ? 'none'  : 'block';
                iconPause.style.display = showPause ? 'block' : 'none';
                playBtn.setAttribute('aria-label', showPause ? 'Pausa' : 'Riproduci');
                showLoading ? playBtn.classList.add('loading')
                            : playBtn.classList.remove('loading');
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = showPause ? 'playing' : 'paused';
                }
            }

            // ── RECOVERY MANAGER ─────────────────────────────────────────
            const recovery = {
                count:         0,
                maxRetries:    10,
                base:          2000,          // 2 s initial delay
                ceiling:       60000,         // 60 s max delay
                circuitPause:  3 * 60 * 1000, // 3 min circuit-open pause
                _retry:   null,
                _circuit: null,
                _tick:    null,
                _stall:   null,

                cancelAll() {
                    clearTimeout(this._retry);
                    clearTimeout(this._circuit);
                    clearInterval(this._tick);
                    clearTimeout(this._stall);
                    this._retry = this._circuit = this._tick = this._stall = null;
                },

                reset() { this.count = 0; this.cancelAll(); },

                // Exponential backoff with ±10% jitter
                delay() {
                    const d = Math.min(this.base * Math.pow(2, this.count), this.ceiling);
                    return d * (0.9 + Math.random() * 0.2);
                },

                _startCountdown(totalMs, label) {
                    clearInterval(this._tick);
                    let rem = Math.ceil(totalMs / 1000);
                    const upd = () => { statusText.textContent = label(rem); };
                    upd();
                    this._tick = setInterval(() => {
                        rem--;
                        if (rem > 0) upd();
                        else { clearInterval(this._tick); this._tick = null; }
                    }, 1000);
                },

                scheduleRetry() {
                    if (this.count >= this.maxRetries) { this.openCircuit(); return; }
                    const d = this.delay();
                    this.count++;
                    setState(S.RECOVERING);
                    const n = this.count, max = this.maxRetries;
                    this._startCountdown(d, r => `RICONNESSIONE ${n}/${max} (${r}s)`);
                    this._retry = setTimeout(() => {
                        clearInterval(this._tick); this._tick = null;
                        if (state === S.RECOVERING) playStream();
                    }, d);
                },

                openCircuit() {
                    setState(S.CIRCUIT_OPEN);
                    const fmt = s => {
                        const m = Math.floor(s / 60), r = s % 60;
                        return m > 0 ? `PAUSA ${m}m ${r}s` : `PAUSA ${r}s`;
                    };
                    this._startCountdown(this.circuitPause, fmt);
                    this._circuit = setTimeout(() => {
                        clearInterval(this._tick); this._tick = null;
                        if (state === S.CIRCUIT_OPEN) {
                            this.count = 0;
                            navigator.onLine ? playStream()
                                             : (setState(S.OFFLINE), statusText.textContent = 'OFFLINE');
                        }
                    }, this.circuitPause);
                },

                onSuccess() { this.reset(); },

                onFailure() {
                    this.cancelAll();
                    if (!navigator.onLine) {
                        setState(S.OFFLINE);
                        statusText.textContent = 'OFFLINE';
                    } else {
                        this.scheduleRetry();
                    }
                },

                // Stall watchdog: if stuck in CONNECTING/BUFFERING for >20 s → recover
                startStall() {
                    clearTimeout(this._stall);
                    this._stall = setTimeout(() => {
                        this._stall = null;
                        if (state === S.BUFFERING || state === S.CONNECTING) this.onFailure();
                    }, 20000);
                },

                stopStall() { clearTimeout(this._stall); this._stall = null; }
            };

            // ── AUDIO LIFECYCLE ──────────────────────────────────────────
            function destroyAudio() {
                if (audio) {
                    audioGen++;              // invalidate all pending events from this element
                    audio.pause();
                    audio.removeAttribute('src');
                    audio.load();
                    audio = null;
                }
            }

            function createAudio() {
                destroyAudio();
                audioGen++;
                const myGen = audioGen;      // captured by closures below

                audio = new Audio();
                audio.volume = volumeSlider.value / 100;

                audio.addEventListener('playing', () => {
                    if (myGen !== audioGen) return;
                    recovery.stopStall();
                    recovery.onSuccess();
                    setState(S.PLAYING);
                    statusText.textContent = 'IN RIPRODUZIONE';
                });

                audio.addEventListener('waiting', () => {
                    if (myGen !== audioGen) return;
                    if (state === S.PLAYING || state === S.CONNECTING) {
                        setState(S.BUFFERING);
                        statusText.textContent = 'BUFFERING...';
                        recovery.startStall();
                    }
                });

                // stalled = browser stopped receiving stream data
                audio.addEventListener('stalled', () => {
                    if (myGen !== audioGen) return;
                    if (state === S.PLAYING || state === S.BUFFERING || state === S.CONNECTING)
                        recovery.startStall();
                });

                // ended should never happen on a live stream
                audio.addEventListener('ended', () => {
                    if (myGen !== audioGen) return;
                    if (state === S.PLAYING) recovery.onFailure();
                });

                audio.addEventListener('error', () => {
                    if (myGen !== audioGen) return;
                    if (state !== S.PAUSED && state !== S.IDLE) recovery.onFailure();
                });
            }

            async function playStream() {
                createAudio();
                const gen = audioGen;
                setState(S.CONNECTING);
                statusText.textContent = 'CONNESSIONE...';
                audio.src = STREAM_URL;
                try {
                    await audio.play();
                } catch (e) {
                    if (gen === audioGen && state === S.CONNECTING) recovery.onFailure();
                }
            }

            function play() { recovery.reset(); playStream(); }

            function pause() {
                recovery.cancelAll();
                setState(S.PAUSED);
                statusText.textContent = 'IN PAUSA';
                destroyAudio();
            }

            function togglePlay() {
                if (state === S.PLAYING  || state === S.BUFFERING   ||
                    state === S.CONNECTING || state === S.RECOVERING ||
                    state === S.CIRCUIT_OPEN) {
                    pause();         // any active state → stop / cancel recovery
                } else {
                    play();          // IDLE, PAUSED, OFFLINE → start
                }
            }

            // ── CONTROLS ─────────────────────────────────────────────────
            playBtn.addEventListener('click', togglePlay);

            volumeSlider.addEventListener('input', () => {
                paintVolume();
                if (audio) audio.volume = volumeSlider.value / 100;
            });

            // Desktop keyboard shortcuts: Space / K = play-pause, ↑ ↓ = volume
            document.addEventListener('keydown', e => {
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                if (infoOverlay.classList.contains('visible')) return;
                const t = e.target;
                const onControl = t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON');
                if ((e.code === 'Space' && !onControl) || e.key === 'k' || e.key === 'K') {
                    e.preventDefault();
                    togglePlay();
                } else if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && t !== volumeSlider) {
                    e.preventDefault();
                    const step = e.key === 'ArrowUp' ? 5 : -5;
                    volumeSlider.value = Math.max(0, Math.min(100, +volumeSlider.value + step));
                    volumeSlider.dispatchEvent(new Event('input'));
                }
            });

            // ── NETWORK EVENTS ────────────────────────────────────────────
            window.addEventListener('online', () => {
                if (state === S.OFFLINE   ||
                    state === S.RECOVERING ||
                    state === S.CIRCUIT_OPEN) {
                    recovery.cancelAll();
                    recovery.count = 0;
                    setState(S.CONNECTING);
                    statusText.textContent = 'RETE RIPRISTINATA...';
                    // Small delay to let the network settle
                    setTimeout(() => {
                        if (state === S.CONNECTING) playStream();
                    }, 1000);
                }
            });

            window.addEventListener('offline', () => {
                if (state !== S.IDLE && state !== S.PAUSED) {
                    recovery.cancelAll();
                    destroyAudio();
                    setState(S.OFFLINE);
                    statusText.textContent = 'OFFLINE';
                }
            });

            // ── VISIBILITY CHANGE ─────────────────────────────────────────
            // When the user returns to the tab, check if audio silently died
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && state === S.PLAYING && audio && audio.paused) {
                    recovery.onFailure();
                }
            });

            // ── METADATA ─────────────────────────────────────────────────
            async function fetchMetadata() {
                try {
                    const response = await fetch(METADATA_URL);
                    const data = await response.json();
                    const source = data.icestats && data.icestats.source;
                    if (!source) return;

                    const src = Array.isArray(source) ? source[0] : source;
                    const rawTitle = src.title || '';

                    if (rawTitle && rawTitle !== lastTitle) {
                        lastTitle = rawTitle;
                        const parts = rawTitle.split(' - ');
                        const artist = parts.length > 1 ? parts[0].trim() : '';
                        const title  = parts.length > 1 ? parts.slice(1).join(' - ').trim() : rawTitle.trim();

                        songTitle.textContent  = title || 'Radio CB';
                        artistName.textContent = artist || '';
                        songTitle.title  = title || '';
                        artistName.title = artist || '';
                        currentMeta = { title: title, artist: artist };
                        document.title = title ? `${title}${artist ? ' · ' + artist : ''} — Radio CB` : 'Radio CB';

                        if (artist && title) {
                            fetchCover(artist, title);
                        } else {
                            setCover(FALLBACK_COVER);
                        }
                        updateMediaSession();
                    }
                } catch (e) {
                    // silent fail
                }
            }

            async function fetchCover(artist, title) {
                try {
                    const query = encodeURIComponent(`${artist} ${title}`);
                    const resp = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&limit=1`);
                    const data = await resp.json();
                    if (data.results && data.results.length > 0) {
                        setCover(data.results[0].artworkUrl100.replace('100x100', '600x600'));
                    } else {
                        setCover(FALLBACK_COVER);
                    }
                } catch (e) {
                    setCover(FALLBACK_COVER);
                }
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', play);
                navigator.mediaSession.setActionHandler('pause', pause);
                try { navigator.mediaSession.setActionHandler('stop', pause); } catch (e) {}
            }

            setInterval(fetchMetadata, 3000);
            fetchMetadata();
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
